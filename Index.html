<!doctype html>

<meta charset="utf-8">

<title>INSMART - Welcome Demo</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:#fff;display:grid;place-items:center;color:#073b70}
.screen{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 22px;background:linear-gradient(180deg,#07529a 0%,#2d78b8 38%,#eaf4ff 38%,#fff 100%);text-align:center}
.logo{display:block;width:min(88%,330px);height:auto;object-fit:contain;border:3px solid #fff;border-radius:5px;box-shadow:0 5px 18px #001f4d35;margin-bottom:26px}
.kicker{font-size:17px;font-weight:700;letter-spacing:1.5px;color:#fff;margin-bottom:16px}
.brand{font-size:clamp(54px,15vw,76px);line-height:1;font-weight:900;letter-spacing:3px;color:#07529a;text-shadow:0 3px 0 #c8def5;margin:0}
.rule{width:90px;height:5px;border-radius:9px;background:#e3b341;margin:22px 0}
.loading{width:190px;height:7px;border-radius:10px;background:#d2e2f2;overflow:hidden;margin-top:18px}
.loading span{display:block;height:100%;width:0;background:#07529a;border-radius:10px;animation:load 2.8s linear forwards}
.status{font-size:13px;letter-spacing:1.5px;color:#426987;margin-top:12px}
.disclaimer{font-size:10px;line-height:1.4;color:#60798c;margin-top:25px;max-width:310px}
@keyframes load{to{width:100%}}
@media(min-width:500px){.screen{min-height:850px;height:92vh;border-radius:28px;box-shadow:0 10px 45px #8ba9c433}}
</style>
