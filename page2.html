<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INSMART - Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#eaf1f5;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;color:#344b5a}
.phone{width:min(100%,420px);min-height:100vh;background:linear-gradient(160deg,#fff 0%,#f7fbfd 65%,#eaf6f3 100%);display:flex;flex-direction:column;align-items:center;padding:34px 28px 24px;position:relative;box-shadow:0 0 35px #aab9c455}
.avatar{width:92px;height:92px;border-radius:50%;background:#dcecf2;border:5px solid #fff;box-shadow:0 2px 10px #78909c55;display:grid;place-items:center;margin-top:0;color:#66818e}
.avatar svg{width:48px;height:48px}
.greeting{margin-top:26px;text-align:center;font-size:20px;font-weight:600;letter-spacing:.3px}
.name{margin-top:6px;text-align:center;font-size:21px;font-weight:700;letter-spacing:.5px}
.dots{display:flex;gap:17px;justify-content:center;margin:25px 0 13px}
.dot{width:15px;height:15px;border-radius:50%;border:2px solid #8297a2;background:transparent}
.dot.filled{background:#526c79;border-color:#526c79}
.line{width:88%;height:1px;background:#d5e0e4}
.forgot{margin:35px 0 27px;font-weight:700;letter-spacing:2px;font-size:15px;text-align:center;color:#3d5a68}
.pad{width:100%;max-width:340px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px}
.key{height:78px;border:0;background:transparent;color:#263f4b;font-size:32px;font-weight:400;border-radius:12px}
.key:active{background:#e5eff2}
.bottom{width:100%;display:flex;justify-content:flex-end;margin-top:18px}
.close{border:0;background:transparent;color:#496674;font-weight:700;letter-spacing:2px;padding:14px 18px}
.hint{font-size:12px;color:#78909c;margin-top:10px;min-height:16px}
@media(min-width:500px){.phone{min-height:850px;height: min(92vh,900px);border-radius:30px}}
</style>
</head>
<body>
<main class="phone">
  <div class="avatar" aria-hidden="true">
    <svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="21" r="12" fill="currentColor" opacity=".9"/><path d="M10 56c2-13 10-20 22-20s20 7 22 20" fill="currentColor" opacity=".9"/></svg>
  </div>
  <div class="greeting">Hi,</div>
  <div class="name">MOHD SHABAAN ANSARI</div>
  <div class="dots" id="dots" aria-label="PIN entry">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>
  <div class="line"></div>
  <div class="forgot">FORGOT MPIN/ USER UNLOCK</div>
  <section class="pad" aria-label="Number keypad">
    <button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button>
    <button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button>
    <button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button>
    <span></span><button class="key" data-key="0">0</button><button class="key" data-key="back" aria-label="Delete">⌫</button>
  </section>
  <div class="hint" id="hint" aria-live="polite"></div>
  <div class="bottom"><button class="close" id="close">CLOSE</button></div>
</main>
<script>
let pin = "";
const dots = [...document.querySelectorAll(".dot")];
const hint = document.getElementById("hint");
function render(){ dots.forEach((d,i)=>d.classList.toggle("filled",i<pin.length)); }
function press(k){
  if(k==="back"){pin=pin.slice(0,-1);hint.textContent="";render();return;}
  if(pin.length>=4)return;
  pin+=k;render();
  if(pin.length===4){
    if(pin==="0000"){
      hint.textContent="Login successful";
      setTimeout(()=>{ window.location.href="page3.html"; },350);
    } else {
      hint.textContent="Incorrect  PIN";
      setTimeout(()=>{pin="";render();},700);
    }
  }
}
document.querySelectorAll("[data-key]").forEach(b=>b.addEventListener("click",()=>press(b.dataset.key)));
document.getElementById("close").addEventListener("click",()=>{pin="";render();hint.textContent="";});
document.addEventListener("keydown",e=>{if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==="Backspace")press("back");});
</script>
</body>
</html>
