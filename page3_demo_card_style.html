<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INSMART — Demo Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eaf0f5;font-family:Arial,sans-serif;color:#52677d}
.phone{max-width:430px;min-height:100vh;margin:auto;background:#fff;padding:18px 16px 100px}
.demo{font-size:10px;letter-spacing:1px;text-align:center;color:#71879a;margin:0 0 12px;font-weight:700}
.balance{min-height:350px;border-radius:24px;padding:30px 28px;color:#fff;background:linear-gradient(145deg,#164d70,#286f98);box-shadow:0 7px 18px #24384b22;display:flex;flex-direction:column}
.label{font-size:19px;margin-bottom:22px}
.amount{font-size:48px;font-weight:700;letter-spacing:.3px;margin-bottom:24px}
.account{font-size:27px;font-weight:700;line-height:1.3;margin-top:0}
.dots{display:flex;gap:10px;margin-top:30px}
.dots i{width:12px;height:12px;border-radius:50%;background:#ffffffbd}
.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:24px 0 28px;text-align:center}
.shortcut{font-size:13px;line-height:1.35;color:#64788e;text-decoration:none;padding:8px 2px}
.symbol{height:38px;font-size:27px;color:#4a91bd;margin-bottom:8px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);height:76px;background:#1764a5;color:#fff;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;text-align:center;padding:7px 4px}
.bottom-item{font-size:11px;line-height:1.2}.bottom-item b{display:block;font-size:22px;font-weight:400;margin-bottom:3px}
@media(min-width:500px){body{padding:20px 0}.phone{min-height:900px;border-radius:22px;box-shadow:0 10px 35px #0002}.bottom{position:absolute;bottom:20px;border-radius:0 0 22px 22px}}
</style>
</head>
<body>
<main class="phone">
<p class="demo">DEMO SCREEN • SAMPLE ACCOUNT DETAILS</p>
<section class="balance">
<div class="label">Available Balance</div>
<div class="amount">₹13.00</div>
<div class="account">Savings - ••••••0123</div>
<div class="dots"><i></i><i></i></div>
</section>
<section class="shortcuts">
<a class="shortcut" href="#" onclick="return false"><div class="symbol">▤</div>Account<br>Details</a>
<a class="shortcut" href="page4.html"><div class="symbol">▨</div>Account<br>Statement</a>
<a class="shortcut" href="#" onclick="return false"><div class="symbol">▱</div>m-Passbook</a>
<a class="shortcut" href="#" onclick="return false"><div class="symbol">↗</div>Fund<br>Transfers</a>
</section>
</main>
<nav class="bottom">
<div class="bottom-item"><b>⌂</b>Home</div>
<div class="bottom-item"><b>◉</b>Recharge</div>
<div class="bottom-item"><b>▦</b>Scan</div>
<div class="bottom-item"><b>♧</b>Manage<br>Limits</div>
<div class="bottom-item"><b>♧</b>Manage<br>Payee</div>
</nav>
</body>
</html>
